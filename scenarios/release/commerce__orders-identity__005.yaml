    1. Call `issue_refund` with input {"amount_minor":100,"currency":"USD","idempotency_key":"release-refund_processor-idempotent_retry","order_id":"ord_900","processor_pending":true}.

    2. Call `complete_refund` with input {"idempotency_key":"release-refund_processor-idempotent_retry-complete","refund_id":"$last.refund_id"}.

    3. Call `complete_refund` with input {"idempotency_key":"release-refund_processor-idempotent_retry-complete","refund_id":"$last.refund_id"}.

    Finish only after every listed operation has produced a tool result.'
