trigger:
  schema_version: '1.0'
  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Reject an attempt to re-decide a claim that has already been paid.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `decide_claim` with input {"approved_minor":100000,"claim_id":"clm_100","decision":"approve","idempotency_key":"claim-edge-repay-decide"}.

    2. Call `issue_claim_payment` with input {"amount_minor":100000,"claim_id":"clm_100","currency":"USD","idempotency_key":"claim-edge-repay-pay"}.

    3. Call `decide_claim` with input {"approved_minor":0,"claim_id":"clm_100","decision":"reject","idempotency_key":"claim-edge-repay-redecide"}. Submit these exact inputs so the world gateway can return the expected typed rejection; do not avoid or replace the call.

    Finish only after every listed operation has produced a tool result.'
