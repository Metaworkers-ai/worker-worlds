      approved_minor: 70000
      idempotency_key: claim-settle-policy-dec-1
    result_status: success
    count: 1
  tags: []
  evidence_config: {}
- schema_version: '1.0'
  id: insurance.claims.101.tool-result.3
  type: tool_result_matches
