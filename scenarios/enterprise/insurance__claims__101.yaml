  id: insurance.claims.101.event
  type: action_count
  severity: critical
  event: claim.payment_issued
  required: true
  description: ''
  parameters:
    event_type: claim.payment_issued
    count: 1
  tags: []
  evidence_config: {}
- schema_version: '1.0'
  id: insurance.claims.101.tool-result.1
