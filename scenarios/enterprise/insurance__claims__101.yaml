schema_version: '1.0'
id: insurance.claims.101
world:
  schema_version: '1.0'
  name: postgres-insurance
  version: '1.0'
  seed: 7101
trigger:
  schema_version: '1.0'
  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Validate the policy, approve, and settle a claim end to end.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `get_policy` with input {"policy_id":"pol_900"}.

    2. Call `decide_claim` with input {"approved_minor":70000,"claim_id":"clm_100","decision":"approve","idempotency_key":"claim-settle-policy-dec-1"}.

    3. Call `issue_claim_payment` with input {"amount_minor":70000,"claim_id":"clm_100","currency":"USD","idempotency_key":"claim-settle-policy-pay-1"}.

    Finish only after every listed operation has produced a tool result.'
limits:
  schema_version: '1.0'
  wall_time_s: 30.0
  tool_calls: 20
  model_tokens: 12000
  worker_turns: 50
  mutations: 20
  cost_minor: 0
  tool_timeout_s: 10.0
  injections: 20
assertions:
