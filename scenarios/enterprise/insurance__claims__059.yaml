  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Escalate an investigation, then record the resulting denial.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `escalate_investigation` with input {"claim_id":"clm_100","idempotency_key":"claim-escalate-then-reject-esc","reason":"Investigation opened before denial can be finalized."}.

    2. Call `decide_claim` with input {"approved_minor":0,"claim_id":"clm_100","decision":"reject","idempotency_key":"claim-escalate-then-reject-dec"}.

    Finish only after every listed operation has produced a tool result.'
