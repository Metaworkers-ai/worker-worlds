    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `search_campaigns` with input {"advertiser_id":"other_adv_9001","status":"draft"}. Submit these exact inputs so the world gateway can return the expected typed rejection; do not avoid or replace the call.

    Finish only after every listed operation has produced a tool result.

