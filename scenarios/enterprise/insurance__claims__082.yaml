    2. Call `decide_claim` with input {"approved_minor":50000,"claim_id":"clm_100","decision":"approve","idempotency_key":"claim-approve-conflict-1"}. Submit these exact inputs so the world gateway can return the expected typed rejection; do not avoid or replace the call.

    Finish only after every listed operation has produced a tool result.'
