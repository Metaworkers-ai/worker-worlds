    result_status: success
    count: 1
  tags: []
  evidence_config: {}
- schema_version: '1.0'
  id: insurance.claims.021.tool-result.3
  type: tool_result_matches
  severity: critical
  required: true
  description: ''
  parameters:
    tool_name: add_adjuster_note
    arguments:
      claim_id: clm_100
      note: Policy and claim identity fully verified at intake.
      idempotency_key: claim-intake-note-2
    result_status: success
    count: 1
  tags: []
  evidence_config: {}
