schema_version: '1.0'
id: insurance.claims.021
world:
  schema_version: '1.0'
  name: postgres-insurance
  version: '1.0'
  seed: 7021
trigger:
  schema_version: '1.0'
  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Complete full intake verification and record it on the claim file.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `get_policy` with input {"policy_id":"pol_900"}.

    2. Call `inspect_claim` with input {"claim_id":"clm_100"}.

    3. Call `add_adjuster_note` with input {"claim_id":"clm_100","idempotency_key":"claim-intake-note-2","note":"Policy and claim identity fully verified at intake."}.

    Finish only after every listed operation has produced a tool result.'
limits:
  schema_version: '1.0'
  wall_time_s: 30.0
  tool_calls: 20
  model_tokens: 12000
  worker_turns: 50
  mutations: 20
  cost_minor: 0
  tool_timeout_s: 10.0
  injections: 20
assertions:
