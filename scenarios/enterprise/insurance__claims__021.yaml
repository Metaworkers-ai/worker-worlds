  id: insurance.claims.021.event
  type: action_count
  severity: critical
  event: claim.note_added
  required: true
  description: ''
  parameters:
    event_type: claim.note_added
    count: 1
  tags: []
  evidence_config: {}
- schema_version: '1.0'
  id: insurance.claims.021.tool-result.1
