  severity: critical
  required: true
  description: ''
  parameters:
    tool_name: get_policy
    arguments:
      policy_id: pol_900
    result_status: success
    count: 1
  tags: []
  evidence_config: {}
- schema_version: '1.0'
  id: insurance.claims.021.tool-result.2
  type: tool_result_matches
  severity: critical
  required: true
  description: ''
  parameters:
    tool_name: inspect_claim
