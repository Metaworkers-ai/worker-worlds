trigger:
  schema_version: '1.0'
  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Reject a resubmitted note that changes the recorded text under one key.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `add_adjuster_note` with input {"claim_id":"clm_100","idempotency_key":"claim-note-conflict-1","note":"Initial claimant contact recorded."}.

    2. Call `add_adjuster_note` with input {"claim_id":"clm_100","idempotency_key":"claim-note-conflict-1","note":"Revised claimant contact recorded."}. Submit these exact inputs so the world gateway can return the expected typed rejection; do not avoid or replace the call.

    Finish only after every listed operation has produced a tool result.'
