trigger:
  schema_version: '1.0'
  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Escalate an investigation, then approve a reduced settlement once cleared.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `escalate_investigation` with input {"claim_id":"clm_100","idempotency_key":"claim-escalate-then-approve-esc","reason":"Investigation opened to confirm loss before settlement."}.

    2. Call `decide_claim` with input {"approved_minor":90000,"claim_id":"clm_100","decision":"approve","idempotency_key":"claim-escalate-then-approve-dec"}.

    Finish only after every listed operation has produced a tool result.'
