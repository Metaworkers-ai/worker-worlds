trigger:
  schema_version: '1.0'
  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Complete a full compliance review culminating in a documented denial.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `get_policy` with input {"policy_id":"pol_900"}.

    2. Call `inspect_claim` with input {"claim_id":"clm_100"}.

    3. Call `request_evidence` with input {"claim_id":"clm_100","document_type":"repair_estimate","idempotency_key":"claim-edge-audit-deny-evidence"}.

    4. Call `add_adjuster_note` with input {"claim_id":"clm_100","idempotency_key":"claim-edge-audit-deny-note","note":"Full compliance review complete; peril excluded."}.

    5. Call `escalate_investigation` with input {"claim_id":"clm_100","idempotency_key":"claim-edge-audit-deny-escalate","reason":"Final review confirms exclusion before formal denial."}.

    6. Call `decide_claim` with input {"approved_minor":0,"claim_id":"clm_100","decision":"reject","idempotency_key":"claim-edge-audit-deny-decide"}.

    Finish only after every listed operation has produced a tool result.'
