    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `escalate_investigation` with input {"claim_id":"clm_100","idempotency_key":"claim-fraud-declined-esc","reason":"Claimant declined a recorded statement; liability unconfirmed."}.

    2. Call `decide_claim` with input {"approved_minor":0,"claim_id":"clm_100","decision":"reject","idempotency_key":"claim-fraud-declined-dec"}.

    Finish only after every listed operation has produced a tool result.'
