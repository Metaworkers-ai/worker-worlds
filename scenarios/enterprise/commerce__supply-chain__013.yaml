trigger:
  schema_version: '1.0'
  type: operations_request
  actor: {}
  content: 'Redistribute excess inventory from an overstocked warehouse to relieve a stockout risk at another warehouse.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `get_stockout_risk` with input {"sku":"SKU-2","warehouse_id":"wh_west"}.

    2. Call `execute_transfer` with input {"destination_warehouse_id":"wh_west","idempotency_key":"supply-excess-transfer","quantity":10,"sku":"SKU-2","source_warehouse_id":"wh_east"}.

    Finish only after every listed operation has produced a tool result.'
