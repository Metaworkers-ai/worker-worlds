trigger:
  schema_version: '1.0'
  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Settle a claim in full and record the payment confirmation.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `decide_claim` with input {"approved_minor":90000,"claim_id":"clm_100","decision":"approve","idempotency_key":"claim-settle-note-dec-1"}.

    2. Call `issue_claim_payment` with input {"amount_minor":90000,"claim_id":"clm_100","currency":"USD","idempotency_key":"claim-settle-note-pay-1"}.

    3. Call `add_adjuster_note` with input {"claim_id":"clm_100","idempotency_key":"claim-settle-note-log-1","note":"Payment issued via direct deposit; claimant notified."}.

    Finish only after every listed operation has produced a tool result.'
