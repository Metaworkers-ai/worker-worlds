    2. Call `request_evidence` with input {"claim_id":"clm_100","document_type":"repair_estimate","idempotency_key":"claim-evidence-after-approve-req"}. Submit these exact inputs so the world gateway can return the expected typed rejection; do not avoid or replace the call.

    Finish only after every listed operation has produced a tool result.'
