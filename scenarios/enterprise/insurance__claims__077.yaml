    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `add_adjuster_note` with input {"claim_id":"clm_100","idempotency_key":"claim-approve-note-1","note":"Repair shop confirmed final invoice matches estimate."}.

    2. Call `decide_claim` with input {"approved_minor":100000,"claim_id":"clm_100","decision":"approve","idempotency_key":"claim-approve-note-dec-1"}.

    Finish only after every listed operation has produced a tool result.'
