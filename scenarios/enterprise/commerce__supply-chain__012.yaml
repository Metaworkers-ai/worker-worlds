  id: commerce.supply-chain.012.event
  type: action_count
  severity: critical
  event: supplier.delay_escalated
  required: true
  description: ''
  parameters:
    event_type: supplier.delay_escalated
    count: 1
  tags: []
  evidence_config: {}
- schema_version: '1.0'
  id: commerce.supply-chain.012.tool-result.1
  type: tool_result_matches
  severity: critical
  required: true
  description: ''
  parameters:
    tool_name: escalate_supplier_delay
    arguments:
      supplier_id: sup_primary
      reason: lead time exceeds forecast window
      idempotency_key: supply-escalate-retry
    result_status: success
    count: 2
  tags: []
  evidence_config: {}
