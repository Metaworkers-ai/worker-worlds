trigger:
  schema_version: '1.0'
  type: operations_request
  actor: {}
  content: 'Retry a supplier-delay escalation without duplicating the escalation.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `escalate_supplier_delay` with input {"idempotency_key":"supply-escalate-retry","reason":"lead time exceeds forecast window","supplier_id":"sup_primary"}.

    2. Call `escalate_supplier_delay` with input {"idempotency_key":"supply-escalate-retry","reason":"lead time exceeds forecast window","supplier_id":"sup_primary"}.

    Finish only after every listed operation has produced a tool result.'
limits:
  schema_version: '1.0'
  wall_time_s: 30.0
  tool_calls: 20
  model_tokens: 12000
  worker_turns: 50
  mutations: 20
  cost_minor: 0
  tool_timeout_s: 10.0
  injections: 20
assertions:
