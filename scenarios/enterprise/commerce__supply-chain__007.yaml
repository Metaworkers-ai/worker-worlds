    2. Call `execute_transfer` with input {"destination_warehouse_id":"wh_west","idempotency_key":"supply-transfer-retry","quantity":5,"sku":"SKU-2","source_warehouse_id":"wh_east"}.

    Finish only after every listed operation has produced a tool result.'
