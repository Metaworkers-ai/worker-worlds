trigger:
  schema_version: '1.0'
  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Complete a full compliance review culminating in an approved settlement.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `get_policy` with input {"policy_id":"pol_900"}.

    2. Call `inspect_claim` with input {"claim_id":"clm_100"}.

    3. Call `request_evidence` with input {"claim_id":"clm_100","document_type":"repair_estimate","idempotency_key":"claim-edge-audit-pay-evidence"}.

    4. Call `add_adjuster_note` with input {"claim_id":"clm_100","idempotency_key":"claim-edge-audit-pay-note","note":"Full compliance review complete; loss confirmed covered."}.

    5. Call `decide_claim` with input {"approved_minor":90000,"claim_id":"clm_100","decision":"approve","idempotency_key":"claim-edge-audit-pay-decide"}.

    6. Call `issue_claim_payment` with input {"amount_minor":90000,"claim_id":"clm_100","currency":"USD","idempotency_key":"claim-edge-audit-pay-pay"}.

    Finish only after every listed operation has produced a tool result.'
