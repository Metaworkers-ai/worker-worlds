trigger:
  schema_version: '1.0'
  type: claims_request
  actor:
    customer_id: ins_cus_102
  content: 'Confirm payment delivery to the claimant and record the confirmation.

    Use the available world tools and complete the task now in the listed order.

    Do not ask for details already supplied, and do not invent or substitute values.

    1. Call `decide_claim` with input {"approved_minor":100000,"claim_id":"clm_100","decision":"approve","idempotency_key":"claim-note-after-pay-decision"}.

    2. Call `issue_claim_payment` with input {"amount_minor":100000,"claim_id":"clm_100","currency":"USD","idempotency_key":"claim-note-after-pay-payment"}.

    3. Call `add_adjuster_note` with input {"claim_id":"clm_100","idempotency_key":"claim-note-after-pay-log","note":"Payment confirmation communicated to claimant."}.

    Finish only after every listed operation has produced a tool result.'
