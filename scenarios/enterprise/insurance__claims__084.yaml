    1. Call `add_adjuster_note` with input {"claim_id":"clm_100","idempotency_key":"claim-deny-note-1","note":"Confirmed peril excluded under policy language."}.

    2. Call `decide_claim` with input {"approved_minor":0,"claim_id":"clm_100","decision":"reject","idempotency_key":"claim-deny-note-dec-1"}.

    Finish only after every listed operation has produced a tool result.'
