  id: marketing.campaign-analyst.150.event
  type: action_count
  severity: critical
  event: campaign.analyst_note_added
  required: true
  description: ''
  parameters:
    event_type: campaign.analyst_note_added
    count: 1
  tags: []
  evidence_config: {}
- schema_version: '1.0'
  id: marketing.campaign-analyst.150.tool-result.1
  type: tool_result_matches
  severity: critical
  required: true
  description: ''
  parameters:
    tool_name: escalate_compliance_review
    arguments:
      campaign_id: cmp_100
      reason: Escalating for a full compliance review of targeting and creative.
      idempotency_key: esc-chain-2
    result_status: success
    count: 1
  tags: []
  evidence_config: {}
- schema_version: '1.0'
  id: marketing.campaign-analyst.150.tool-result.2
  type: tool_result_matches
  severity: critical
  required: true
  description: ''
  parameters:
