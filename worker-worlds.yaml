schema_version: "1.0"
execution:
  world: stub
  worker: stub
  scenario_locations: [examples/scenarios]
  repetitions: 1
  concurrency: 4
reporting:
  mode: auto
  output: .worker-worlds/runs
database: {}
baselines_directory: .worker-worlds/baselines
provider: {}
agents:
  local-stub:
    schema_version: "1.0"
    id: local-stub
    version: "1.0.0"
    adapter: stub
  langgraph-project:
    schema_version: "1.0"
    id: langgraph-project
    version: "1.0.0"
    adapter: langgraph
    factory: worker_worlds.example_factories:create_langgraph_agent
    required_env: [OPENAI_API_KEY]
    model:
      provider: openai
      name: gpt-5-mini
  openai-project:
    schema_version: "1.0"
    id: openai-project
    version: "1.0.0"
    adapter: openai-agents
    factory: worker_worlds.example_factories:create_openai_agent
    required_env: [OPENAI_API_KEY]
    model:
      provider: openai
      name: gpt-5-mini
comparison:
  critical_occurrences_allowed: 0
  new_high_failures_allowed: 0
  minimum_candidate_pass_rate: 0
  maximum_pass_rate_decrease: 0.02
  maximum_flakiness_increase: 0.10
  maximum_infrastructure_error_rate: 0.01
  maximum_p50_latency_increase: 1.0
  maximum_p95_latency_increase: 1.0
  maximum_token_increase: 1.0
  maximum_cost_increase: 1.0
  required_minimum_repetitions: 5
  insufficient_samples: warning
  practical_significance: 0.02
