[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "worker-worlds"
version = "1.0.0rc1"
description = "Deterministic simulation and regression testing for AI workers"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Metaworkers AI"}]
keywords = ["agents", "evaluation", "simulation", "commerce", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["asyncpg>=0.30,<1", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
  "asyncpg-stubs>=0.31,<0.32",
  "twine>=7,<8",
  "fastapi[standard]>=0.141,<1",
  "httpx>=0.28,<1",
]
langgraph = ["langgraph==1.2.10", "langchain==1.3.14", "langchain-openai==1.4.1"]
openai-agents = ["openai-agents==0.19.4"]
api = ["fastapi[standard]>=0.141,<1"]

[project.scripts]
worker-worlds = "worker_worlds.cli:main"
worker-worlds-schema = "worker_worlds.schema_cli:main"
worker-worlds-api = "worker_worlds.api:main"
worker-worlds-openapi = "worker_worlds.openapi_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_worlds"]

[tool.hatch.build.targets.wheel.shared-data]
"schemas" = "share/worker-worlds/schemas"
"catalog" = "share/worker-worlds/catalog"
"scenarios/release" = "share/worker-worlds/scenarios"
"scenarios/enterprise" = "share/worker-worlds/enterprise-scenarios"
"examples/scenarios" = "share/worker-worlds/examples/scenarios"
"docs/assets" = "share/worker-worlds/report-assets"

[tool.hatch.build.targets.sdist]
include = ["src", "schemas", "catalog", "scenarios", "examples", "migrations", "docs", "scripts", "site", "worker-worlds.yaml", "compose.yaml", "Makefile", "README.md", "LICENSE", "SECURITY.md", "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "E", "F", "I", "SIM", "UP"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/worker_worlds/postgres_world.py" = ["E501"]
"src/worker_worlds/reporting.py" = ["E501"]
"scripts/benchmark.py" = ["E501"]
"src/worker_worlds/review.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["worker_worlds"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: credential-guarded paid-provider smoke tests disabled by default"]
filterwarnings = [
  "ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
