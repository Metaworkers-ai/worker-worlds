services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    # max_connections raised from the 100 default: tests/test_enterprise_domains.py
    # opens one connection per enterprise scenario concurrently via asyncio.gather,
    # and the enterprise corpus (currently 103, target ~127 once claims-analyst
    # reaches 102) now exceeds the default ceiling.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: worker_worlds_dev
      POSTGRES_USER: worker_worlds
      POSTGRES_PASSWORD: worker_worlds_local
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worker_worlds -d worker_worlds_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - worker_worlds_pgdata:/var/lib/postgresql/data

volumes:
  worker_worlds_pgdata:
