name: Worker Worlds PR gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  worker-worlds:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: worker_worlds
          POSTGRES_PASSWORD: worker_worlds_local
          POSTGRES_DB: worker_worlds_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U worker_worlds -d worker_worlds_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      WORKER_WORLDS_DATABASE_URL: postgresql://worker_worlds:worker_worlds_local@127.0.0.1:55432/worker_worlds_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: make setup
      - run: make verify
        env:
          WORKER_WORLDS_TEST_DATABASE_URL: postgresql://worker_worlds:worker_worlds_local@127.0.0.1:55432/worker_worlds_test
      - uses: ./.github/actions/worker-worlds
        with:
          scenario-path: examples/scenarios/refund_happy.yaml
          repetitions: "5"
          concurrency: "4"
          output-directory: .worker-worlds/ci
      - if: always()
        run: |
          echo '## Worker Worlds' >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifacts contain deterministic JSON, JUnit, and offline HTML evidence.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-worlds-pr
          path: .worker-worlds/ci
