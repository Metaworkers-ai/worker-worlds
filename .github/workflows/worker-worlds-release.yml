name: Worker Worlds release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: worker-worlds-schema check
      - run: worker-worlds scenario export scenarios/release --check
      - run: python scripts/build_docs.py
      - run: python -m build
      - run: python scripts/release_artifacts.py
      - run: python -m venv /tmp/ww-release && /tmp/ww-release/bin/pip install dist/*.whl && /tmp/ww-release/bin/worker-worlds version
      - uses: actions/upload-artifact@v4
        with:
          name: worker-worlds-${{ matrix.os }}
          path: |
            dist
            site
# Publication is deliberately absent. A maintainer must separately approve PyPI and GitHub release steps.
